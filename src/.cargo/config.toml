# Static musl builds for every supported OpenWrt architecture.
#
# The crate has no dependencies, so a cross compile needs nothing beyond a Rust
# toolchain with the matching target installed: `rust-lld` ships with rustc and
# the musl targets link fully static and self-contained. No host gcc and no
# foreign sysroot, which keeps the SDK build reproducible.

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.i686-unknown-linux-musl]
linker = "rust-lld"
