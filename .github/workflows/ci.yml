name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl

      - name: Formatting
        working-directory: src
        run: cargo fmt --check

      - name: Clippy
        working-directory: src
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit and regression tests
        working-directory: src
        run: cargo test --locked --release

      - name: Cross compile for the router
        working-directory: src
        run: cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: The artefact must be a static aarch64 binary
        working-directory: src
        run: |
          binary=target/aarch64-unknown-linux-musl/release/h5000m-fancontrol
          test -x "$binary"
          file "$binary" | tee /dev/stderr | grep -Eq 'ELF 64-bit.*ARM aarch64.*statically linked'
          ldd "$binary" 2>&1 | grep -q 'not a dynamic executable'
          ls -lh "$binary"

  frontend:
    name: LuCI frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext shellcheck

      - name: JavaScript syntax
        run: node --check htdocs/luci-static/resources/view/h5000m/fancontrol.js

      - name: Browser-faithful render checks
        run: node tests/frontend-smoke.js

      - name: Translation catalogue is complete and valid
        run: |
          node scripts/i18n-audit.js
          msgfmt --check --check-format -o /dev/null po/zh_Hans/h5000m-fancontrol.po

      - name: Validate JSON metadata
        run: |
          jq empty root/usr/share/luci/menu.d/luci-app-h5000m-fancontrol.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-h5000m-fancontrol.json

      - name: Shell scripts
        run: |
          for file in root/etc/init.d/h5000m-fancontrol \
                     root/etc/uci-defaults/91-h5000m-fancontrol-v3 \
                     root/usr/sbin/h5000m-fancontrol-status \
                     scripts/build-release.sh tests/*.sh; do
            sh -n "$file"
          done
          shellcheck -s sh root/etc/init.d/h5000m-fancontrol \
                     root/etc/uci-defaults/91-h5000m-fancontrol-v3 \
                     root/usr/sbin/h5000m-fancontrol-status tests/*.sh
          shellcheck -s bash scripts/build-release.sh

  regression:
    name: Device-behaviour regression tests
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Status contract, control cycle and packaging guards
        run: |
          ./tests/test-status-contract.sh
          ./tests/test-uci-defaults.sh
          ./tests/test-packaging.sh

  kernel-safety:
    name: Kernel thermal protection guards
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Static red-line guards
        run: ./tests/test-kernel-safety.sh

      - name: Kernel protection assertions must run
        working-directory: src
        run: cargo test --locked --release -- protection
